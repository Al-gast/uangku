<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15966a" />
    <title>Offline | UangKu</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f4f7f5;
        --surface: #ffffff;
        --foreground: #15231d;
        --muted: #66736d;
        --border: #dfe7e2;
        --accent: #15966a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0e1512;
          --surface: #161f1b;
          --foreground: #f1f6f3;
          --muted: #9caaa3;
          --border: #2a3832;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        padding: 28px;
      }

      img {
        width: 56px;
        height: 56px;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 1.75rem;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin-top: 24px;
        border-radius: 16px;
        background: var(--accent);
        padding: 0 18px;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/uangku-192.png" alt="" />
      <h1>Koneksi terputus</h1>
      <p>
        UangKu belum bisa memuat halaman baru. Data keuangan tetap diambil dari
        server saat koneksi tersedia kembali.
      </p>
      <a href="/dashboard">Coba lagi</a>
    </main>
  </body>
</html>
